<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>女兒早餐店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* 這是一支獨立、自給自足的單檔頁面：樣式跟腳本都內嵌，不依賴 css/style.css 或 js/ 底下任何檔案，
       直接用瀏覽器打開就能跑。設計語彙（顏色/圓角/陰影/66px 觸控目標）沿用小一練習網的 design system。 */
    :root {
      --bg: #fff9f0;
      --ink: #292524;
      --ink-soft: #78716c;
      --ink-faint: #a8a29e;
      --white: #ffffff;
      --radius-lg: 28px;
      --radius-md: 22px;
      --radius-sm: 16px;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.06);
      --breakfast-grad: linear-gradient(145deg, #f472b6, #fb7185);
      --breakfast-shadow: rgba(244, 114, 182, 0.35);
      --green-grad: linear-gradient(135deg, #22c55e, #4ade80);
      --green-shadow: rgba(34, 197, 94, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button { font-family: inherit; }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* 根容器統一 16px 間距，讓每一排區塊自動有呼吸空間。 */
    #order-root {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---------- 店招 ---------- */
    .shop-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .shop-sign {
      font-size: 64px;
      line-height: 1;
      animation: bounceSign 2.2s ease-in-out infinite;
      cursor: pointer;
    }

    /* 長按叫出家長設定時，招牌慢慢放大當進度提示（放開就恢復）。 */
    .shop-sign.is-holding {
      animation: none;
      transform: scale(1.35);
      transition: transform 3s ease-in;
    }

    @keyframes bounceSign {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .shop-title {
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 900;
      margin: 0;
    }

    .shop-subtitle {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-soft);
      margin: 0;
    }

    .info-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff1f2;
      border-radius: var(--radius-md);
      padding: 16px 18px;
      font-weight: 800;
      font-size: 15px;
      color: #9f1239;
    }

    .info-banner .info-emoji { font-size: 26px; }

    .order-count {
      align-self: flex-end;
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-weight: 800;
      font-size: 15px;
      color: var(--ink-soft);
      box-shadow: var(--shadow-sm);
    }

    /* ---------- 類別區塊 ---------- */
    .bo-group {
      background: var(--white);
      border: 3px solid #f5f5f4;
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .bo-group.accent-main { border-color: #fde68a; }
    .bo-group.accent-protein { border-color: #fecdd3; }
    .bo-group.accent-fruit { border-color: #d9f99d; }
    .bo-group.accent-drink { border-color: #a5f3fc; }

    .bo-group-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 類別圖示放淺色底 + 彩色描邊，不用飽和漸層，否則 💪 / 🥤 這種暖色 Twemoji 會跟底色糊在一起。 */
    .bo-group-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 14px;
      border: 2.5px solid transparent;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bo-group.accent-main .bo-group-icon { border-color: #fbbf24; background: #fffbeb; }
    .bo-group.accent-protein .bo-group-icon { border-color: #fb7185; background: #fff1f2; }
    .bo-group.accent-fruit .bo-group-icon { border-color: #a3e635; background: #f7fee7; }
    .bo-group.accent-drink .bo-group-icon { border-color: #4dd0e1; background: #ecfeff; }

    .bo-group-icon-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .bo-group-icon-img.is-fallback {
      font-size: 24px;
      line-height: 28px;
    }

    .bo-group-label {
      flex: 1;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bo-daily-tag {
      background: linear-gradient(145deg, #f59e0b, #fbbf24);
      color: var(--white);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .bo-group-note {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-soft);
      margin-top: -4px;
    }

    .bo-group-pick {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-faint);
      white-space: nowrap;
    }

    .bo-group-pick.is-picked {
      color: var(--white);
      background: var(--green-grad);
      border-radius: 999px;
      padding: 5px 12px;
    }

    .bo-item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
      gap: 10px;
    }

    .bo-item {
      position: relative;
      border: 3px solid #f5f5f4;
      border-radius: var(--radius-sm);
      background: var(--bg);
      padding: 12px 6px 10px;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .bo-item:active { transform: translateY(2px); }

    .bo-item-emoji {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }

    .bo-item-emoji.is-fallback {
      font-size: 40px;
      line-height: 46px;
    }

    .bo-item-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
    }

    .bo-item-special {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 15px;
      line-height: 1;
    }

    .bo-item-price {
      background: #fff7ed;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: 900;
      color: #c2410c;
    }

    .bo-item.selected .bo-item-price {
      background: #bbf7d0;
      color: #166534;
    }

    .bo-item-check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #22c55e;
      color: var(--white);
      font-size: 14px;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .bo-item.selected {
      border-color: #22c55e;
      background: #dcfce7;
      box-shadow: 0 4px 14px var(--green-shadow);
    }

    .bo-item.selected .bo-item-check {
      display: flex;
      animation: correctPop 0.3s ease;
    }

    @keyframes correctPop {
      0% { transform: scale(0.4); }
      70% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    /* ---------- 我的餐盤 + 送出 ---------- */
    .bo-summary {
      background: var(--white);
      border: 3px dashed #e7e5e4;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bo-summary-label {
      font-size: 15px;
      font-weight: 900;
      color: var(--ink-soft);
    }

    .bo-summary-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .bo-summary-chip,
    .bo-history-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff7ed;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: 800;
      color: #9a3412;
    }

    .bo-chip-emoji {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .bo-chip-emoji.is-fallback {
      font-size: 18px;
      line-height: 22px;
    }

    .bo-chip-price {
      font-size: 13px;
      font-weight: 900;
      color: #c2410c;
      opacity: .7;
    }

    .bo-summary-total {
      align-self: flex-end;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .bo-summary-total strong {
      font-size: 26px;
      font-weight: 900;
      color: #c2410c;
    }

    .bo-summary-empty {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-faint);
    }

    .big-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      font-size: 20px;
      font-weight: 900;
      color: var(--white);
      background: var(--breakfast-grad);
      box-shadow: 0 6px 20px var(--breakfast-shadow);
      cursor: pointer;
      min-height: 66px;
    }

    .big-button:disabled {
      background: #e7e5e4;
      color: var(--ink-faint);
      box-shadow: none;
      cursor: not-allowed;
    }

    .ghost-button {
      width: 100%;
      border: 2px solid #e7e5e4;
      border-radius: 18px;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink-soft);
      background: var(--white);
      cursor: pointer;
      min-height: 66px;
    }

    /* ---------- 送出後的訂單卡 ---------- */
    .bo-receipt {
      position: relative;
      background: var(--white);
      border: 3px solid #fbcfe8;
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px var(--breakfast-shadow);
      overflow: hidden;
    }

    .bo-receipt-emoji {
      font-size: 56px;
      line-height: 1;
    }

    .bo-receipt-title {
      font-size: 28px;
      font-weight: 900;
    }

    .bo-receipt-subtitle {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .bo-receipt-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .bo-receipt-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
    }

    .bo-receipt-emoji-img {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      object-fit: contain;
    }

    .bo-receipt-emoji-img.is-fallback {
      font-size: 30px;
      line-height: 36px;
    }

    .bo-receipt-name {
      flex: 1;
      font-size: 20px;
      font-weight: 900;
    }

    .bo-receipt-cat {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-faint);
    }

    .bo-receipt-price {
      font-size: 17px;
      font-weight: 900;
      color: #c2410c;
      min-width: 60px;
      text-align: right;
    }

    .bo-receipt-row.is-total {
      background: #fff7ed;
      border: 2px dashed #fdba74;
    }

    .bo-receipt-price.is-total {
      font-size: 24px;
    }

    .bo-receipt-mascot {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-soft);
      margin-top: 6px;
    }

    .bo-actions {
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }

    .confetti-piece {
      position: absolute;
      top: 16px;
      font-size: 24px;
      pointer-events: none;
      animation: confettiFly 0.9s ease-out forwards;
    }

    @keyframes confettiFly {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
    }

    /* ---------- 點餐紀錄 ---------- */
    .bo-history {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 2px dashed #e7e5e4;
      padding-top: 16px;
    }

    .bo-history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bo-history-title {
      font-size: 20px;
      font-weight: 900;
    }

    .bo-history-count {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-faint);
    }

    .bo-history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bo-history-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--white);
      border: 2.5px solid #f5f5f4;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .bo-history-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bo-history-time {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .bo-history-total {
      background: #fff7ed;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: 900;
      color: #c2410c;
    }

    .bo-history-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .bo-history-remove {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border: none;
      border-radius: 10px;
      background: #fee2e2;
      color: #ef4444;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .bo-history-empty {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-faint);
      text-align: center;
      padding: 20px 12px;
    }

    .bo-clear-all {
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: #ef4444;
      cursor: pointer;
      padding: 8px;
      text-decoration: underline;
    }

    /* ---------- 家長設定面板 ---------- */
    /* 這一區是給大人看的，字比較小、密度比較高，跟給小孩的點餐畫面刻意做出區別。 */
    #parent-overlay {
      position: fixed;
      inset: 0;
      background: rgba(41, 37, 36, 0.45);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      overflow-y: auto;
      z-index: 50;
    }

    .parent-panel {
      background: var(--white);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .parent-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .parent-title {
      font-size: 22px;
      font-weight: 900;
    }

    .parent-close {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: #f5f5f4;
      color: var(--ink-soft);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .parent-subtitle {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
      color: var(--ink-soft);
    }

    .parent-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .parent-section-title {
      font-size: 14px;
      font-weight: 900;
      color: var(--ink);
    }

    .parent-chosen {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 34px;
      align-items: center;
    }

    .parent-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      border: 2px solid #6ee7b7;
      border-radius: 999px;
      padding: 5px 8px 5px 12px;
      font-size: 14px;
      font-weight: 800;
      color: #065f46;
    }

    .parent-chip-remove {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: #d1fae5;
      color: #047857;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .parent-empty {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-faint);
    }

    .parent-reuse {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-soft);
      cursor: pointer;
      text-align: left;
    }

    .parent-preset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
      gap: 8px;
    }

    .parent-preset {
      border: 2px solid #f5f5f4;
      border-radius: 12px;
      background: var(--bg);
      padding: 10px 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .parent-preset.selected {
      border-color: #22c55e;
      background: #dcfce7;
    }

    .parent-preset-emoji {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .parent-preset-emoji.is-fallback {
      font-size: 26px;
      line-height: 30px;
    }

    .parent-preset-name {
      font-size: 14px;
      font-weight: 800;
    }

    .parent-preset-price {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-faint);
    }

    .parent-emoji-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .parent-emoji {
      width: 40px;
      height: 40px;
      border: 2px solid #f5f5f4;
      border-radius: 10px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .parent-emoji.selected {
      border-color: #22c55e;
      background: #dcfce7;
    }

    .parent-emoji-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .parent-emoji-img.is-fallback {
      font-size: 20px;
      line-height: 24px;
    }

    .parent-custom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .parent-input {
      flex: 1;
      min-width: 120px;
      border: 2px solid #e7e5e4;
      border-radius: 12px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      background: var(--white);
      user-select: text;
    }

    .parent-input:focus {
      outline: none;
      border-color: #fb7185;
    }

    .parent-input-price {
      flex: 0 0 84px;
      min-width: 0;
      text-align: right;
    }

    .parent-unit {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .parent-add {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: var(--breakfast-grad);
      color: var(--white);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .parent-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="order-root"></div>
  </div>

  <script>
    // 自畫的 SVG 圖示：Unicode 根本沒有「饅頭」這個 emoji（🍞 是吐司、🥟 是水餃），
    // 硬借別的 emoji 小孩會看錯，所以直接畫一顆蒸籠上的白饅頭。
    // 畫法對齊 Twemoji 的風格：36x36 網格、純色平面、不描邊，這樣跟旁邊的 emoji 圖擺在一起才不會突兀。
    const CUSTOM_ICONS = {
      mantou: `
        <svg class="{{cls}}" viewBox="0 0 36 36" role="img" aria-label="饅頭">
          <g stroke="#CFC8BC" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".75">
            <path d="M12.5 9.4c-2.2-2 2.2-3.4 0-5.4" />
            <path d="M18 8.2c-2.2-2 2.2-3.4 0-5.4" />
            <path d="M23.5 9.4c-2.2-2 2.2-3.4 0-5.4" />
          </g>
          <path d="M6 24.5c0-7.2 5.4-12.5 12-12.5s12 5.3 12 12.5z" fill="#FAF4E8" />
          <path d="M10.8 21.2c.5-3.6 3-6.2 6.2-6.8-4.2-.4-7.5 2.7-7.9 6.8z" fill="#FFFFFF" opacity=".85" />
          <path d="M6 24.5h24v1.6H6z" fill="#EFE3CE" />
          <rect x="3.6" y="26.1" width="28.8" height="6.3" rx="2.2" fill="#E0A96D" />
          <rect x="3.6" y="28.4" width="28.8" height="1.7" fill="#C68F52" opacity=".5" />
        </svg>`
    };

    // 菜單：四個類別，每類最多點 1 樣、也可以不點。價格用 5 的倍數，方便小孩自己加總。
    // 台式早餐有些品項沒有專屬 emoji：蛋餅用 🫓（薄餅）、無糖豆漿用 🫘（豆子）形狀最接近；
    // 小饅頭沒有堪用的替代品，改用上面 CUSTOM_ICONS 的自畫圖示（emoji 欄位保留 🍞 當載不到時的最後退路）。
    // 水果種類太多，全部攤開會讓那一區長得比其他三區都長，所以設 daily:3 —— 只上架「今日特選」3 種，
    // 每天自動換一批（挑法見 pickDailyItems）。要調整每天上幾種只要改 daily 的數字。
    const BREAKFAST_MENU = [
      {
        id: "main",
        label: "主食",
        emoji: "🍳",
        accent: "main",
        items: [
          { id: "egg-crepe", name: "蛋餅", emoji: "🫓", price: 25 },
          { id: "sweet-potato", name: "地瓜", emoji: "🍠", price: 20 },
          { id: "cucumber", name: "小黃瓜", emoji: "🥒", price: 10 },
          { id: "banana-pancake", name: "香蕉煎餅", emoji: "🥞", price: 30 },
          { id: "mantou", name: "小饅頭", emoji: "🍞", icon: "mantou", price: 15 },
          { id: "blueberry-yogurt", name: "藍莓優格", emoji: "🫐", price: 35 }
        ]
      },
      {
        id: "protein",
        label: "蛋白質",
        emoji: "💪",
        accent: "protein",
        items: [
          { id: "boiled-egg", name: "水煮蛋", emoji: "🥚", price: 10 },
          { id: "fried-egg", name: "荷包蛋", emoji: "🍳", price: 15 },
          { id: "cheese", name: "起司", emoji: "🧀", price: 15 }
        ]
      },
      {
        // 香蕉跟蘋果家裡幾乎每天都有，所以固定常駐；其他水果不一定有，
        // 硬推薦會害小孩點到家裡沒有的東西，所以改由家長在「家長設定」裡挑今天真的有的，
        // 沒設定的日子這一區就只有香蕉、蘋果，寧可少也不要給不存在的選項。
        id: "fruit",
        label: "水果",
        emoji: "🍎",
        accent: "fruit",
        acceptsDaily: true,
        items: [
          { id: "banana", name: "香蕉", emoji: "🍌", price: 15 },
          { id: "apple", name: "蘋果", emoji: "🍎", price: 20 }
        ],
        // 家長設定面板裡「從清單挑」的選項，不會直接出現在點餐畫面上。
        extraItems: [
          { id: "strawberry", name: "草莓", emoji: "🍓", price: 30 },
          { id: "grape", name: "葡萄", emoji: "🍇", price: 25 },
          { id: "orange", name: "橘子", emoji: "🍊", price: 15 },
          { id: "watermelon", name: "西瓜", emoji: "🍉", price: 20 },
          { id: "kiwi", name: "奇異果", emoji: "🥝", price: 20 },
          { id: "pineapple", name: "鳳梨", emoji: "🍍", price: 25 },
          { id: "mango", name: "芒果", emoji: "🥭", price: 30 },
          { id: "pear", name: "水梨", emoji: "🍐", price: 25 },
          { id: "tomato", name: "小番茄", emoji: "🍅", price: 15 },
          { id: "guava", name: "芭樂", emoji: "🍈", price: 20 },
          { id: "waxapple", name: "蓮霧", emoji: "🍎", price: 25 }
        ]
      },
      {
        id: "drink",
        label: "飲料",
        emoji: "🥤",
        accent: "drink",
        items: [
          { id: "milk", name: "牛奶", emoji: "🥛", price: 20 },
          { id: "soy-milk", name: "無糖豆漿", emoji: "🫘", price: 15 },
          { id: "water", name: "水", emoji: "💧", price: 5 }
        ]
      }
    ];

    // 家長自己輸入水果時可以挑的圖示。只允許這一排裡的 emoji（renderEmoji 會把字串塞進 onerror 屬性裡，
    // 讓使用者輸入的內容跑進去會有注入風險），輸入的名稱則一律走 escapeHtml。
    const FRUIT_EMOJI_PALETTE = ["🍈", "🍓", "🍇", "🍊", "🍉", "🥝", "🍍", "🥭", "🍐", "🍅", "🍑", "🍒", "🥥", "🫐", "🍌", "🍎"];

    // 今日特選存在 localStorage，而且綁「哪一天設定的」。
    // 隔天就自動失效（水果區回到只有香蕉、蘋果），因為昨天有的水果今天不一定還有；
    // 家長設定面板裡會保留上次的內容，按「沿用」一鍵帶回來，不用整組重挑。
    const DAILY_KEY = "breakfast:daily-fruits";

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function loadDailySpecials() {
      try {
        const saved = JSON.parse(localStorage.getItem(DAILY_KEY));
        if (!saved || !Array.isArray(saved.items)) return { date: null, items: [] };
        return { date: saved.date || null, items: saved.items };
      } catch (e) {
        return { date: null, items: [] };
      }
    }

    function saveDailySpecials(items) {
      try {
        localStorage.setItem(DAILY_KEY, JSON.stringify({ date: todayKey(), items }));
      } catch (e) {
        // 無痕模式等寫不進去的情況，就讓設定只在這一輪有效。
      }
    }

    // 點餐畫面上這一類實際會出現的品項 = 固定常駐 + 今天的特選。
    function groupItems(group) {
      if (!group.acceptsDaily) return group.items;
      return group.items.concat(state.dailySpecials.map((item) => ({ ...item, special: true })));
    }

    // 訂單存在瀏覽器 localStorage，同一台裝置同一個瀏覽器才看得到，新的排最前面。
    const ORDERS_KEY = "breakfast:orders";

    const root = document.querySelector("#order-root");
    const savedDaily = loadDailySpecials();
    const state = {
      view: "order",   // "order" 點餐中 / "done" 送出後的訂單卡
      selected: {},    // { 類別id: 品項id }，沒點的類別就不放 key
      lastOrder: null,
      orders: loadOrders(),
      // 只有「今天」設定的才算數，昨天的設定不會出現在點餐畫面上。
      dailySpecials: savedDaily.date === todayKey() ? savedDaily.items : [],
      lastDaily: savedDaily,          // 給家長面板的「沿用上次」用
      parentDraft: null               // 家長面板開著時的暫存清單
    };

    render();

    function render() {
      root.innerHTML = state.view === "done" ? renderDone() : renderOrder();
      bindCommon();
      bindParentGate();
      if (state.view === "done") {
        root.querySelector("#bo-again").addEventListener("click", () => {
          state.view = "order";
          state.selected = {};
          state.lastOrder = null;
          render();
          window.scrollTo(0, 0);
        });
      } else {
        root.querySelectorAll(".bo-item").forEach((btn) => {
          btn.addEventListener("click", () => toggleItem(btn.dataset.group, btn.dataset.item));
        });
        const submit = root.querySelector("#bo-submit");
        if (!submit.disabled) submit.addEventListener("click", handleSubmit);
      }
    }

    // 歷史紀錄的刪除／清除按鈕在兩種畫面都會出現，統一在這裡綁。
    function bindCommon() {
      root.querySelectorAll(".bo-history-remove").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.orders = state.orders.filter((o) => o.id !== btn.dataset.orderId);
          saveOrders(state.orders);
          render();
        });
      });

      const clearAll = root.querySelector("#bo-clear-all");
      if (clearAll) {
        clearAll.addEventListener("click", () => {
          if (!confirm("要清除全部的點餐紀錄嗎？")) return;
          state.orders = [];
          saveOrders(state.orders);
          render();
        });
      }
    }

    function toggleItem(groupId, itemId) {
      if (state.selected[groupId] === itemId) {
        delete state.selected[groupId];
      } else {
        state.selected[groupId] = itemId;
      }
      playTone(state.selected[groupId] ? 620 : 380, 0.08);
      render();
    }

    function selectedList() {
      const list = [];
      BREAKFAST_MENU.forEach((group) => {
        const itemId = state.selected[group.id];
        if (!itemId) return;
        const item = groupItems(group).find((i) => i.id === itemId);
        if (item) list.push({ category: group.label, name: item.name, emoji: item.emoji, icon: item.icon, price: item.price });
      });
      return list;
    }

    // 加總金額。舊的訂單紀錄沒有 price 欄位，這種就回 null，畫面上單純不顯示金額，不要顯示錯的數字。
    function sumPrice(items) {
      if (items.some((i) => typeof i.price !== "number")) return null;
      return items.reduce((total, i) => total + i.price, 0);
    }

    function handleSubmit() {
      const items = selectedList();
      if (items.length === 0) return;
      const order = { id: `${Date.now()}`, timestamp: new Date().toISOString(), items };
      state.orders = [order, ...state.orders];
      saveOrders(state.orders);
      state.lastOrder = order;
      state.view = "done";
      render();
      window.scrollTo(0, 0);
      spawnConfetti(root.querySelector(".bo-receipt"));
      playCorrectSound();
      setTimeout(() => speakText("早餐點好囉，馬上來"), 400);
    }

    function renderOrder() {
      const picked = selectedList();
      const total = sumPrice(picked);
      return `
        <div class="shop-head">
          <div class="shop-sign">🥪</div>
          <h1 class="shop-title">女兒早餐店</h1>
          <p class="shop-subtitle">今天想吃什麼呢？</p>
        </div>
        <div class="info-banner">
          <span class="info-emoji">👩‍🍳</span>
          <span>每一類可以點一樣，也可以不點～點好按下面的「送出訂單」！</span>
        </div>
        <div class="order-count">🧺 已點 ${picked.length} 樣</div>
        ${BREAKFAST_MENU.map(renderGroup).join("")}
        <div class="bo-summary">
          <span class="bo-summary-label">🧾 我的餐盤</span>
          <div class="bo-summary-chips">${picked.length === 0
            ? `<span class="bo-summary-empty">還沒點東西喔</span>`
            : picked.map((i) => `<span class="bo-summary-chip">${renderItemIcon(i, "bo-chip-emoji")}${escapeHtml(i.name)}<span class="bo-chip-price">${i.price} 元</span></span>`).join("")}</div>
          ${picked.length === 0 ? "" : `<div class="bo-summary-total">💰 合計 <strong>${total}</strong> 元</div>`}
        </div>
        <button class="big-button" id="bo-submit" ${picked.length === 0 ? "disabled" : ""}>🛎️ 送出訂單${picked.length === 0 ? "" : `（${total} 元）`}</button>
        ${renderHistory()}
      `;
    }

    function renderGroup(group) {
      const items = groupItems(group);
      const pickedId = state.selected[group.id];
      const picked = pickedId && items.find((i) => i.id === pickedId);
      const hasSpecials = group.acceptsDaily && state.dailySpecials.length > 0;
      const note = group.acceptsDaily
        ? (hasSpecials ? "香蕉、蘋果每天都有，今天還多了特選水果喔！" : "香蕉、蘋果每天都有～")
        : group.note;
      return `
        <div class="bo-group accent-${group.accent}">
          <div class="bo-group-head">
            <span class="bo-group-icon">${renderEmoji(group.emoji, "bo-group-icon-img")}</span>
            <span class="bo-group-label">${escapeHtml(group.label)}${hasSpecials ? `<span class="bo-daily-tag">✨ 今日特選</span>` : ""}</span>
            <span class="bo-group-pick${picked ? " is-picked" : ""}">${picked ? `已選：${escapeHtml(picked.name)}` : "可以不選"}</span>
          </div>
          ${note ? `<div class="bo-group-note">${escapeHtml(note)}</div>` : ""}
          <div class="bo-item-grid">
            ${items.map((item) => `
              <button class="bo-item${pickedId === item.id ? " selected" : ""}" data-group="${group.id}" data-item="${escapeHtml(item.id)}">
                ${item.special ? `<span class="bo-item-special">✨</span>` : ""}
                ${renderItemIcon(item, "bo-item-emoji")}
                <span class="bo-item-name">${escapeHtml(item.name)}</span>
                <span class="bo-item-price">${item.price} 元</span>
                <span class="bo-item-check">✓</span>
              </button>`).join("")}
          </div>
        </div>
      `;
    }

    function renderDone() {
      const order = state.lastOrder;
      const total = sumPrice(order.items);
      return `
        <div class="bo-receipt">
          <div class="bo-receipt-emoji">🛎️</div>
          <div class="bo-receipt-title">訂單送出囉！</div>
          <div class="bo-receipt-subtitle">${formatFullTime(order.timestamp)}</div>
          <div class="bo-receipt-list">
            ${order.items.map((i) => `
              <div class="bo-receipt-row">
                ${renderItemIcon(i, "bo-receipt-emoji-img")}
                <span class="bo-receipt-name">${escapeHtml(i.name)}</span>
                <span class="bo-receipt-cat">${escapeHtml(i.category)}</span>
                ${typeof i.price === "number" ? `<span class="bo-receipt-price">${i.price} 元</span>` : ""}
              </div>`).join("")}
            ${total === null ? "" : `
              <div class="bo-receipt-row is-total">
                <span class="bo-receipt-name">總共</span>
                <span class="bo-receipt-price is-total">${total} 元</span>
              </div>`}
          </div>
          <div class="bo-receipt-mascot">🍳 早餐做好囉，快來吃！</div>
        </div>
        <div class="bo-actions">
          <button class="big-button" id="bo-again">🔄 再點一次</button>
        </div>
        ${renderHistory()}
      `;
    }

    function renderHistory() {
      if (state.orders.length === 0) {
        return `
          <div class="bo-history">
            <div class="bo-history-head">
              <span class="bo-history-title">📋 點餐紀錄</span>
            </div>
            <div class="bo-history-empty">還沒有任何紀錄，點好餐按「送出訂單」就會存在這裡 ✨</div>
          </div>
        `;
      }
      return `
        <div class="bo-history">
          <div class="bo-history-head">
            <span class="bo-history-title">📋 點餐紀錄</span>
            <span class="bo-history-count">共 ${state.orders.length} 筆</span>
          </div>
          <div class="bo-history-list">
            ${state.orders.map((o) => `
              <div class="bo-history-row">
                <div class="bo-history-text">
                  <span class="bo-history-time">🕘 ${formatFullTime(o.timestamp)}${sumPrice(o.items) === null ? "" : `<span class="bo-history-total">${sumPrice(o.items)} 元</span>`}</span>
                  <span class="bo-history-items">${o.items.map((i) => `<span class="bo-history-chip">${renderItemIcon(i, "bo-chip-emoji")}${escapeHtml(i.name)}</span>`).join("")}</span>
                </div>
                <button class="bo-history-remove" data-order-id="${o.id}" aria-label="刪除這筆紀錄">✕</button>
              </div>`).join("")}
          </div>
          <div class="bo-clear-all" id="bo-clear-all">🗑️ 清除全部紀錄</div>
        </div>
      `;
    }

    // ---------- 家長設定 ----------

    // 入口刻意藏起來：長按店招 🥪 三秒才會打開，畫面上完全沒有提示，小孩不會誤觸。
    // 按住的時候招牌會慢慢放大當進度提示，放開就取消。
    const PARENT_HOLD_MS = 3000;
    let holdTimer = null;

    function bindParentGate() {
      const sign = root.querySelector(".shop-sign");
      if (!sign) return;

      const start = (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        sign.classList.add("is-holding");
        holdTimer = setTimeout(() => {
          sign.classList.remove("is-holding");
          playTone(880, 0.12);
          openParentPanel();
        }, PARENT_HOLD_MS);
      };
      const cancel = () => {
        clearTimeout(holdTimer);
        sign.classList.remove("is-holding");
      };

      sign.addEventListener("pointerdown", start);
      ["pointerup", "pointerleave", "pointercancel"].forEach((evt) => sign.addEventListener(evt, cancel));
      // 長按在手機上會跳出系統選單，擋掉才不會蓋住我們的面板。
      sign.addEventListener("contextmenu", (e) => e.preventDefault());
    }

    function openParentPanel() {
      state.parentDraft = state.dailySpecials.map((i) => ({ ...i }));
      renderParentPanel();
    }

    function closeParentPanel() {
      state.parentDraft = null;
      const overlay = document.querySelector("#parent-overlay");
      if (overlay) overlay.remove();
    }

    function renderParentPanel() {
      let overlay = document.querySelector("#parent-overlay");
      if (!overlay) {
        overlay = document.createElement("div");
        overlay.id = "parent-overlay";
        document.body.appendChild(overlay);
      }

      const draft = state.parentDraft;
      const fruitGroup = BREAKFAST_MENU.find((g) => g.id === "fruit");
      const stale = state.lastDaily.date && state.lastDaily.date !== todayKey() && state.lastDaily.items.length > 0;

      overlay.innerHTML = `
        <div class="parent-panel">
          <div class="parent-head">
            <span class="parent-title">🔧 家長設定</span>
            <button class="parent-close" id="parent-close" aria-label="關閉">✕</button>
          </div>
          <p class="parent-subtitle">設定今天的「今日特選」水果。香蕉、蘋果是固定的，不用設定。<br>設定只算今天，明天會自動清空，避免推薦到家裡沒有的水果。</p>

          <div class="parent-section">
            <span class="parent-section-title">今天已選 ${draft.length} 種</span>
            <div class="parent-chosen">${draft.length === 0
              ? `<span class="parent-empty">還沒設定 — 小孩現在只會看到香蕉、蘋果</span>`
              : draft.map((i) => `<span class="parent-chip">${renderEmoji(i.emoji, "bo-chip-emoji")}${escapeHtml(i.name)}<span class="bo-chip-price">${i.price} 元</span><button class="parent-chip-remove" data-remove="${escapeHtml(i.id)}" aria-label="移除">✕</button></span>`).join("")}</div>
            ${stale ? `<button class="parent-reuse" id="parent-reuse">↩️ 沿用 ${escapeHtml(state.lastDaily.date.slice(5).replace("-", "/"))} 的設定（${state.lastDaily.items.map((i) => escapeHtml(i.name)).join("、")}）</button>` : ""}
          </div>

          <div class="parent-section">
            <span class="parent-section-title">從清單挑</span>
            <div class="parent-preset-grid">
              ${fruitGroup.extraItems.map((item) => `
                <button class="parent-preset${draft.some((d) => d.id === item.id) ? " selected" : ""}" data-preset="${item.id}">
                  ${renderEmoji(item.emoji, "parent-preset-emoji")}
                  <span class="parent-preset-name">${escapeHtml(item.name)}</span>
                  <span class="parent-preset-price">${item.price} 元</span>
                </button>`).join("")}
            </div>
          </div>

          <div class="parent-section">
            <span class="parent-section-title">自己輸入</span>
            <div class="parent-emoji-row">
              ${FRUIT_EMOJI_PALETTE.map((e, idx) => `<button class="parent-emoji${idx === 0 ? " selected" : ""}" data-emoji="${e}">${renderEmoji(e, "parent-emoji-img")}</button>`).join("")}
            </div>
            <div class="parent-custom-row">
              <input class="parent-input" id="parent-name" type="text" placeholder="水果名稱，例如 芭樂" maxlength="8" />
              <input class="parent-input parent-input-price" id="parent-price" type="number" value="20" min="0" max="200" step="5" />
              <span class="parent-unit">元</span>
              <button class="parent-add" id="parent-add">加入</button>
            </div>
          </div>

          <div class="parent-actions">
            <button class="big-button" id="parent-save">✅ 完成設定</button>
            <button class="ghost-button" id="parent-clear">🗑️ 全部清空</button>
          </div>
        </div>
      `;

      overlay.querySelector("#parent-close").addEventListener("click", closeParentPanel);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeParentPanel(); });

      overlay.querySelectorAll("[data-preset]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = fruitGroup.extraItems.find((i) => i.id === btn.dataset.preset);
          const at = draft.findIndex((d) => d.id === item.id);
          if (at >= 0) draft.splice(at, 1); else draft.push({ ...item });
          renderParentPanel();
        });
      });

      overlay.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const at = draft.findIndex((d) => d.id === btn.dataset.remove);
          if (at >= 0) draft.splice(at, 1);
          renderParentPanel();
        });
      });

      overlay.querySelectorAll("[data-emoji]").forEach((btn) => {
        btn.addEventListener("click", () => {
          overlay.querySelectorAll("[data-emoji]").forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
        });
      });

      overlay.querySelector("#parent-add").addEventListener("click", () => {
        const nameInput = overlay.querySelector("#parent-name");
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); return; }
        const priceRaw = Number(overlay.querySelector("#parent-price").value);
        const price = Number.isFinite(priceRaw) && priceRaw >= 0 ? Math.round(priceRaw) : 20;
        const chosen = overlay.querySelector("[data-emoji].selected");
        // 只收 palette 裡的 emoji，避免自由輸入的字串跑進 renderEmoji 的 onerror 屬性。
        const emoji = chosen && FRUIT_EMOJI_PALETTE.includes(chosen.dataset.emoji) ? chosen.dataset.emoji : FRUIT_EMOJI_PALETTE[0];
        draft.push({ id: `custom-${Date.now()}`, name, emoji, price });
        renderParentPanel();
      });

      if (stale) {
        overlay.querySelector("#parent-reuse").addEventListener("click", () => {
          state.parentDraft = state.lastDaily.items.map((i) => ({ ...i }));
          renderParentPanel();
        });
      }

      overlay.querySelector("#parent-clear").addEventListener("click", () => {
        state.parentDraft = [];
        renderParentPanel();
      });

      overlay.querySelector("#parent-save").addEventListener("click", () => {
        state.dailySpecials = draft.map((i) => ({ ...i }));
        saveDailySpecials(state.dailySpecials);
        state.lastDaily = { date: todayKey(), items: state.dailySpecials };
        // 特選被拿掉時，小孩原本選的那一樣要一起清掉，否則會送出畫面上已經看不到的品項。
        const fruitPicked = state.selected.fruit;
        if (fruitPicked && !groupItems(fruitGroup).some((i) => i.id === fruitPicked)) delete state.selected.fruit;
        closeParentPanel();
        render();
      });
    }

    // ---------- 小工具 ----------

    // Twemoji（CC-BY 4.0 開源 emoji 圖庫）圖片，讓圖案在所有裝置/瀏覽器上長得一致，
    // 不依賴系統字型是否收錄該 emoji；載不到才退回系統字型。
    function twemojiUrl(emoji) {
      const codepoints = Array.from(emoji)
        .map((c) => c.codePointAt(0))
        .filter((cp) => cp !== 0xfe0f)
        .map((cp) => cp.toString(16))
        .join("-");
      return `https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/${codepoints}.png`;
    }

    function renderEmoji(emoji, cls) {
      const url = twemojiUrl(emoji);
      return `<img class="${cls}" src="${url}" alt="${escapeHtml(emoji)}" onerror="this.outerHTML='<span class=&quot;${cls} is-fallback&quot;>${emoji}</span>'">`;
    }

    // 品項圖示：有自畫的 SVG 就用自畫的，沒有才回去用 Twemoji 圖。
    // 舊的訂單紀錄可能沒有 icon 欄位，這時就沿用當初存下來的 emoji，不會壞掉。
    function renderItemIcon(item, cls) {
      const custom = item.icon && CUSTOM_ICONS[item.icon];
      return custom ? custom.replace("{{cls}}", cls) : renderEmoji(item.emoji, cls);
    }

    function loadOrders() {
      try {
        return JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveOrders(orders) {
      try {
        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      } catch (e) {
        // 無痕模式等情況下寫不進去，就讓這一輪只留在畫面上，不要整頁壞掉。
      }
    }

    function formatFullTime(iso) {
      const d = new Date(iso);
      return `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // 提示音用 Web Audio API 即時合成、語音用瀏覽器內建 speechSynthesis，都不需要外部音檔。
    let audioCtx = null;
    function playTone(freq, duration, type = "sine") {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain).connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // 瀏覽器不給放音就安靜跳過。
      }
    }

    function playCorrectSound() {
      playTone(660, 0.12);
      setTimeout(() => playTone(880, 0.18), 110);
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-TW";
      utter.rate = 0.95;
      speechSynthesis.speak(utter);
    }

    function spawnConfetti(container) {
      if (!container) return;
      const pieces = ["✨", "⭐", "🎉"];
      for (let i = 0; i < 6; i++) {
        const span = document.createElement("span");
        span.className = "confetti-piece";
        span.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        span.style.left = `${10 + Math.random() * 80}%`;
        span.style.animationDelay = `${Math.random() * 0.2}s`;
        container.appendChild(span);
        setTimeout(() => span.remove(), 1200);
      }
    }
  </script>
</body>
