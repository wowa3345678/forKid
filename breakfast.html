<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>女兒早餐店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* 這是一支獨立、自給自足的單檔頁面：樣式跟腳本都內嵌，不依賴 css/style.css 或 js/ 底下任何檔案，
       直接用瀏覽器打開就能跑。設計語彙（顏色/圓角/陰影/66px 觸控目標）沿用小一練習網的 design system。 */
    :root {
      --bg: #fff9f0;
      --ink: #292524;
      --ink-soft: #78716c;
      --ink-faint: #a8a29e;
      --white: #ffffff;
      --radius-lg: 28px;
      --radius-md: 22px;
      --radius-sm: 16px;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.06);
      --breakfast-grad: linear-gradient(145deg, #f472b6, #fb7185);
      --breakfast-shadow: rgba(244, 114, 182, 0.35);
      --green-grad: linear-gradient(135deg, #22c55e, #4ade80);
      --green-shadow: rgba(34, 197, 94, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button { font-family: inherit; }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* 根容器統一 16px 間距，讓每一排區塊自動有呼吸空間。 */
    #order-root {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---------- 店招 ---------- */
    .shop-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .shop-sign {
      font-size: 64px;
      line-height: 1;
      animation: bounceSign 2.2s ease-in-out infinite;
      cursor: pointer;
    }

    /* 長按叫出家長設定時，招牌慢慢放大當進度提示（放開就恢復）。 */
    .shop-sign.is-holding {
      animation: none;
      transform: scale(1.35);
      transition: transform 3s ease-in;
    }

    @keyframes bounceSign {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .shop-title {
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 900;
      margin: 0;
    }

    .shop-subtitle {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-soft);
      margin: 0;
    }

    .info-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff1f2;
      border-radius: var(--radius-md);
      padding: 16px 18px;
      font-weight: 800;
      font-size: 15px;
      color: #9f1239;
    }

    .info-banner .info-emoji { font-size: 26px; }

    .order-count {
      align-self: flex-end;
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-weight: 800;
      font-size: 15px;
      color: var(--ink-soft);
      box-shadow: var(--shadow-sm);
    }

    /* ---------- 類別區塊 ---------- */
    .bo-group {
      background: var(--white);
      border: 3px solid #f5f5f4;
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .bo-group.accent-main { border-color: #fde68a; }
    .bo-group.accent-protein { border-color: #fecdd3; }
    .bo-group.accent-fruit { border-color: #d9f99d; }
    .bo-group.accent-drink { border-color: #a5f3fc; }

    .bo-group-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 類別圖示放淺色底 + 彩色描邊，不用飽和漸層，否則 💪 / 🥤 這種暖色 Twemoji 會跟底色糊在一起。 */
    .bo-group-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 14px;
      border: 2.5px solid transparent;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bo-group.accent-main .bo-group-icon { border-color: #fbbf24; background: #fffbeb; }
    .bo-group.accent-protein .bo-group-icon { border-color: #fb7185; background: #fff1f2; }
    .bo-group.accent-fruit .bo-group-icon { border-color: #a3e635; background: #f7fee7; }
    .bo-group.accent-drink .bo-group-icon { border-color: #4dd0e1; background: #ecfeff; }

    .bo-group-icon-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .bo-group-icon-img.is-fallback {
      font-size: 24px;
      line-height: 28px;
    }

    .bo-group-label {
      flex: 1;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .bo-daily-tag {
      background: linear-gradient(145deg, #f59e0b, #fbbf24);
      color: var(--white);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .bo-group-note {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-soft);
      margin-top: -4px;
    }

    .bo-group-pick {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-faint);
      white-space: nowrap;
    }

    .bo-group-pick.is-picked {
      color: var(--white);
      background: var(--green-grad);
      border-radius: 999px;
      padding: 5px 12px;
    }

    .bo-item-grid {
      display: grid;
      /* 加了注音之後名字變寬（「香蕉煎餅」四個字各帶一柱注音 + 聲調），格子要跟著加寬才不會擠。 */
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    @media (max-width: 560px) {
      .bo-item-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
    }

    .bo-item {
      position: relative;
      border: 3px solid #f5f5f4;
      border-radius: var(--radius-sm);
      background: var(--bg);
      padding: 12px 6px 10px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .bo-item:active { transform: translateY(2px); }

    .bo-item-emoji {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }

    .bo-item-emoji.is-fallback {
      font-size: 40px;
      line-height: 46px;
    }

    .bo-item-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
    }

    /* ---------- 注音（每個字右邊直排一個，聲調另外定位） ---------- */
    /* --han-size / --yin-size 一起控制大小，窄螢幕再用媒體查詢縮一級。 */
    .has-zhuyin {
      --han-size: 24px;
      --yin-size: 12px;
      --yin-line: 13px;
      --tone-pad: 0.75;
      --char-gap: 3px;
      --yin-gap: 2px;
      /* 佔滿卡片的內容寬度。不寫的話這個 flex 容器是 shrink-to-fit，
         解析出來的寬度會比可用寬度少幾個 px，害剛好放得下的四字名多折一行。 */
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      /* 允許換行當保險：聲調符號會讓字變寬（「藍莓優格」有 3 個聲調，比「香蕉煎餅」寬），
         窄螢幕上寧可折成兩行，也不要凸出卡片外。 */
      flex-wrap: wrap;
      gap: 4px var(--char-gap);
    }

    .zh-char {
      display: inline-flex;
      align-items: flex-start;
    }

    .zh-han {
      font-size: var(--han-size);
      line-height: 1.1;
    }

    .zh-yin {
      position: relative;
      display: inline-block;
      margin-left: var(--yin-gap);
    }

    /* 有二三四聲的字，右邊留出擺聲調的位置；輕聲則是上面留位置。 */
    .zh-yin.has-tone { padding-right: calc(var(--yin-size) * var(--tone-pad)); }
    .zh-yin.has-neutral { padding-top: calc(var(--yin-size) * 1.05); }

    /* 注音柱不用 writing-mode:vertical-rl —— iPad 的 Safari 排直排注音時，
       字元的直向 advance 是拿橫排字型的度量換算的，會比字身小，符號就疊在一起。
       改成一個符號一個 block、自己用 flex 疊起來，高度由 --yin-line 寫死，
       所有瀏覽器排出來都一樣，也不會重疊。 */
    .zh-base {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: var(--yin-size);
      font-weight: 800;
      letter-spacing: 0;
      color: #44403c;
    }

    .zh-sym {
      display: block;
      height: var(--yin-line);
      line-height: var(--yin-line);
    }

    .zh-tone {
      position: absolute;
      right: 0;
      bottom: 0;
      font-size: var(--yin-size);
      font-weight: 800;
      line-height: 1;
      color: #44403c;
    }

    /* 輕聲的點擺在注音柱正上方，不是右邊。 */
    .zh-tone.is-neutral {
      right: auto;
      bottom: auto;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    /* 目標裝置是 iPad，那邊維持 24px。窄螢幕一排只放得下 2 張卡，字級要跟著收，
       不然「藍莓優格」「無糖豆漿」（各有 3 個聲調符號，是最寬的情況）會折成 3+1 的孤字。
       分兩段收，讓大尺寸手機不用一路縮到最小。 */
    @media (max-width: 560px) {
      .has-zhuyin {
        --han-size: 18px;
        --yin-size: 10px;
        --yin-line: 11px;
        --tone-pad: 0.7;
        --char-gap: 2px;
        --yin-gap: 1px;
      }
    }

    @media (max-width: 420px) {
      .has-zhuyin {
        --han-size: 15px;
        --yin-size: 9px;
        --yin-line: 10px;
        --tone-pad: 0.65;
        --char-gap: 1px;
        --yin-gap: 1px;
      }
    }

    .bo-item-special {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 15px;
      line-height: 1;
    }

    .bo-item-price {
      background: #fff7ed;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: 900;
      color: #c2410c;
    }

    .bo-item.selected .bo-item-price {
      background: #bbf7d0;
      color: #166534;
    }

    .bo-item-check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #22c55e;
      color: var(--white);
      font-size: 14px;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .bo-item.selected {
      border-color: #22c55e;
      background: #dcfce7;
      box-shadow: 0 4px 14px var(--green-shadow);
    }

    .bo-item.selected .bo-item-check {
      display: flex;
      animation: correctPop 0.3s ease;
    }

    @keyframes correctPop {
      0% { transform: scale(0.4); }
      70% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    /* ---------- 我的餐盤 + 送出 ---------- */
    .bo-summary {
      background: var(--white);
      border: 3px dashed #e7e5e4;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bo-summary-label {
      font-size: 15px;
      font-weight: 900;
      color: var(--ink-soft);
    }

    .bo-summary-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .bo-summary-chip,
    .bo-history-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff7ed;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: 800;
      color: #9a3412;
    }

    .bo-chip-emoji {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .bo-chip-emoji.is-fallback {
      font-size: 18px;
      line-height: 22px;
    }

    .bo-chip-price {
      font-size: 13px;
      font-weight: 900;
      color: #c2410c;
      opacity: .7;
    }

    /* ---------- 餐盤（大圓盤 + 飲料杯） ---------- */
    .tray {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      background: #f6ede0;
      border: 3px solid #e6d8c2;
      border-radius: 18px;
      padding: 18px 14px;
    }

    /* 餐盤：圓角矩形的分隔餐盤（幼兒園那種），一類一格。
       不用圓盤了 —— 複選之後一格可能有 6 樣，圓形容器的四個角是死區，
       內容一多還會把 aspect-ratio 撐破變成橢圓、食物掉出盤緣。
       分格的好處是位置固定：點一樣蛋白質只有蛋白質那格會動，其他格紋風不動。
       空格用虛線 + 類別名，「哪一類還沒點」直接看得出來，不用再靠盤子底下補一行提示。 */
    .plate {
      /* iPad 上取 360px；窄螢幕才按比例縮，杯子會自己折到盤子下面。 */
      width: min(360px, 86vw);
      background: #fdfbf6;
      border: 4px solid #e7e5e4;
      border-radius: 22px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 第一格（主食）獨佔上排，因為它的選項最多（6 樣）；
       蛋白質、水果分下排。這條規則假設食物類別剛好 3 類、而且選項最多的排在第一個。 */
    .plate-cell:first-child { grid-column: 1 / -1; }

    .plate-cell {
      /* 高度寫死成「折成兩排也放得下」的高度：不管這格是空的、1 樣還是 6 樣，
         餐盤總高度都一樣，點來點去版面不會上下跳。數字是量出來的，不是猜的。 */
      min-height: 138px;
      border-radius: 16px;
      border: 2px solid #ece5d8;
      background: var(--white);
      padding: 7px 6px 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      /* grid 子項預設 min-width:auto，不加這行長名字會把格子撐寬、擠壞另一格。 */
      min-width: 0;
    }

    /* 空格是虛線，跟旁邊空杯子的表現一致。 */
    .plate-cell.is-empty {
      border-style: dashed;
      border-color: #ddd5c6;
      background: transparent;
    }

    .plate-cell-label {
      font-size: 11px;
      font-weight: 900;
      color: var(--ink-faint);
      letter-spacing: 1px;
    }

    .plate-cell-items {
      display: grid;
      justify-items: center;
      align-items: start;
      gap: 6px 4px;
      width: 100%;
    }

    .plate-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }

    /* 動畫只加在「這次新放上去」的那一樣（render 後由 markNewTrayItems 補 class）。
       常駐在 .plate-item 上的話，每點一下整盤都會重跳一次，樣數一多就是雜訊。 */
    .plate-item.is-new,
    .cup.is-new { animation: plateDrop 0.35s ease; }

    @keyframes plateDrop {
      0% { transform: translateY(-10px) scale(0.85); opacity: 0; }
      60% { transform: translateY(2px) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) scale(1); }
    }

    .plate-emoji {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .plate-emoji.is-fallback {
      font-size: 30px;
      line-height: 38px;
    }

    .plate-name {
      font-size: 12px;
      font-weight: 900;
      color: var(--ink);
      text-align: center;
      line-height: 1.15;
      /* 中文不該在詞中間斷，太長就整個折到第二行，不要把格子撐寬。 */
      word-break: keep-all;
      max-width: 72px;
    }

    /* 每格按自己的樣數降級，數量→欄數是寫死的，不讓瀏覽器自由 wrap
       （自由 wrap 會排出 3+1 這種孤兒排）。count-6 同時吃 6 樣以上。 */
    .plate-cell.count-1 .plate-cell-items { grid-template-columns: 1fr; }
    .plate-cell.count-2 .plate-cell-items { grid-template-columns: repeat(2, 1fr); }
    .plate-cell.count-3 .plate-cell-items { grid-template-columns: repeat(3, 1fr); }
    .plate-cell.count-4 .plate-cell-items { grid-template-columns: repeat(2, 1fr); }
    .plate-cell.count-5 .plate-cell-items { grid-template-columns: repeat(3, 1fr); }
    .plate-cell.count-6 .plate-cell-items { grid-template-columns: repeat(3, 1fr); }

    /* 主食格是整排寬，同樣的樣數排得下更多欄，不用折行。 */
    .plate-cell:first-child.count-4 .plate-cell-items { grid-template-columns: repeat(4, 1fr); }
    .plate-cell:first-child.count-5 .plate-cell-items { grid-template-columns: repeat(5, 1fr); }
    .plate-cell:first-child.count-6 .plate-cell-items { grid-template-columns: repeat(6, 1fr); }

    .plate-cell.count-1 .plate-emoji { width: 44px; height: 44px; }
    .plate-cell.count-1 .plate-name { font-size: 13px; }
    .plate-cell.count-3 .plate-emoji { width: 32px; height: 32px; }
    .plate-cell.count-4 .plate-emoji { width: 30px; height: 30px; }
    .plate-cell.count-5 .plate-emoji { width: 26px; height: 26px; }
    .plate-cell.count-6 .plate-emoji { width: 24px; height: 24px; }
    .plate-cell.count-4 .plate-name,
    .plate-cell.count-5 .plate-name,
    .plate-cell.count-6 .plate-name { font-size: 11px; max-width: 60px; }

    /* 杯子：梯形圓底，空的時候是虛線。飲料只能選一杯，所以杯子維持單一格。 */
    .cup-side {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .cup {
      width: 72px;
      height: 90px;
      border-radius: 10px 10px 28px 28px;
      background: var(--white);
      border: 3px dashed #ddd5c6;
      box-shadow: inset 0 0 0 5px #fdfbf6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .cup.filled {
      border-style: solid;
      border-color: #4dd0e1;
    }

    .cup-emoji {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .cup-emoji.is-fallback {
      font-size: 26px;
      line-height: 30px;
    }

    .cup-name {
      font-size: 12px;
      font-weight: 900;
      color: var(--ink);
    }

    .cup-label {
      font-size: 11px;
      font-weight: 900;
      color: var(--ink-faint);
      letter-spacing: 1px;
    }

    /* 窄螢幕餐盤跟著縮，格子裡的東西也要縮一級才不會擠。 */
    @media (max-width: 560px) {
      .plate { padding: 8px; gap: 6px; }
      .plate-cell { min-height: 128px; padding: 6px 4px 8px; }
      .plate-emoji { width: 32px; height: 32px; }
      .plate-cell.count-1 .plate-emoji { width: 38px; height: 38px; }
      .plate-cell.count-3 .plate-emoji { width: 28px; height: 28px; }
      .plate-cell.count-4 .plate-emoji { width: 26px; height: 26px; }
      .plate-cell.count-5 .plate-emoji { width: 23px; height: 23px; }
      .plate-cell.count-6 .plate-emoji { width: 21px; height: 21px; }
      .plate-name { font-size: 11px; max-width: 62px; }

        emoji: "🥤",
        accent: "drink",
        zhuyin: ["ㄧㄣˇ", "ㄌㄧㄠˋ"],
        items: [
          { id: "milk", name: "牛奶", emoji: "🥛", price: 20, zhuyin: ["ㄋㄧㄡˊ", "ㄋㄞˇ"] },
          { id: "soy-milk", name: "無糖豆漿", emoji: "🫘", price: 15, zhuyin: ["ㄨˊ", "ㄊㄤˊ", "ㄉㄡˋ", "ㄐㄧㄤ"] },
          { id: "water", name: "水", emoji: "💧", price: 5, zhuyin: ["ㄕㄨㄟˇ"] }
        ]
      }
    ];

    // 家長自己輸入水果時可以挑的圖示。只允許這一排裡的 emoji（renderEmoji 會把字串塞進 onerror 屬性裡，
    // 讓使用者輸入的內容跑進去會有注入風險），輸入的名稱則一律走 escapeHtml。
    const FRUIT_EMOJI_PALETTE = ["🍈", "🍓", "🍇", "🍊", "🍉", "🥝", "🍍", "🥭", "🍐", "🍅", "🍑", "🍒", "🥥", "🫐", "🍌", "🍎"];

    // 二三四聲的符號（一聲不標）。輕聲的 ˙ 寫在音節最前面，另外處理。
    // 宣告在這裡是因為 render() 在下面就會馬上跑，const 不會 hoist。
    const TONE_MARKS = ["ˊ", "ˇ", "ˋ"];

    // 今日特選存在 localStorage，而且綁「哪一天設定的」。
    // 隔天就自動失效（水果區回到只有香蕉、蘋果），因為昨天有的水果今天不一定還有；
    // 家長設定面板裡會保留上次的內容，按「沿用」一鍵帶回來，不用整組重挑。
    const DAILY_KEY = "breakfast:daily-fruits";

    // 今日特選的上限。水果區 = 固定的香蕉、蘋果 + 特選，設 4 是為了讓這一區最多 6 樣，
    // 跟主食區（6 樣）齊高；再多就會讓水果區長得比其他三區都長，也超過小孩一次掃視得完的量。
    const MAX_DAILY_FRUITS = 4;

    // 刪除紀錄的開關由家長決定，預設關閉：關著的時候每筆的 ✕ 跟「清除全部紀錄」都不會出現，
    // 小孩就不可能誤刪掉整本紀錄。這是長期設定，不像今日特選會過夜失效。
    const ALLOW_DELETE_KEY = "breakfast:allow-delete";

    function loadAllowDelete() {
      try {
        return localStorage.getItem(ALLOW_DELETE_KEY) === "1";
      } catch (e) {
        return false;
      }
    }

    function saveAllowDelete(allow) {
      try {
        localStorage.setItem(ALLOW_DELETE_KEY, allow ? "1" : "0");
      } catch (e) {
        // 寫不進去就讓設定只在這一輪有效。
      }
    }

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function loadDailySpecials() {
      try {
        const saved = JSON.parse(localStorage.getItem(DAILY_KEY));
        if (!saved || !Array.isArray(saved.items)) return { date: null, items: [] };
        // 上限是後來才加的，之前存的可能超過，讀進來就先截掉，不然畫面會比設定畫面允許的還多。
        return { date: saved.date || null, items: saved.items.slice(0, MAX_DAILY_FRUITS) };
      } catch (e) {
        return { date: null, items: [] };
      }
    }

    function saveDailySpecials(items) {
      try {
        localStorage.setItem(DAILY_KEY, JSON.stringify({ date: todayKey(), items }));
      } catch (e) {
        // 無痕模式等寫不進去的情況，就讓設定只在這一輪有效。
      }
    }

    // 點餐畫面上這一類實際會出現的品項 = 固定常駐 + 今天的特選。
    function groupItems(group) {
      if (!group.acceptsDaily) return group.items;
      return group.items.concat(state.dailySpecials.map((item) => ({ ...item, special: true })));
    }

    // 訂單存在瀏覽器 localStorage，同一台裝置同一個瀏覽器才看得到，新的排最前面。
    const ORDERS_KEY = "breakfast:orders";

    const root = document.querySelector("#order-root");
    const savedDaily = loadDailySpecials();
    const state = {
      view: "order",   // "order" 點餐中 / "done" 送出後的訂單卡
      selected: {},    // { 類別id: [品項id] }，沒點的類別就不放 key。飲料的陣列長度最多 1。
      lastOrder: null,
      orders: loadOrders(),
      // 只有「今天」設定的才算數，昨天的設定不會出現在點餐畫面上。
      dailySpecials: savedDaily.date === todayKey() ? savedDaily.items : [],
      lastDaily: savedDaily,          // 給家長面板的「沿用上次」用
      allowDelete: loadAllowDelete(),
      parentDraft: null,              // 家長面板開著時的暫存清單
      parentDraftAllowDelete: false   // 同上，按「完成設定」才寫入
    };

    // 上一輪畫面上餐盤裡有哪些東西。用來判斷這次 render 誰是新加的，只讓新的播掉落動畫。
    let shownTrayKeys = new Set();

    render();

    function render() {
      root.innerHTML = state.view === "done" ? renderDone() : renderOrder();
      markNewTrayItems();
      bindCommon();
      bindParentGate();
      if (state.view === "done") {
        root.querySelector("#bo-again").addEventListener("click", () => {
          state.view = "order";
          state.selected = {};
          state.lastOrder = null;
          render();
          window.scrollTo(0, 0);
        });
      } else {
        root.querySelectorAll(".bo-item").forEach((btn) => {
          btn.addEventListener("click", () => toggleItem(btn.dataset.group, btn.dataset.item));
        });
        const submit = root.querySelector("#bo-submit");
        if (!submit.disabled) submit.addEventListener("click", handleSubmit);
      }
    }

    // render() 會整段重建 HTML，所以掉落動畫如果常駐在 CSS 上，每點一下整盤都會重跳一次。
    // 這裡比對上一輪，只給「這次才出現」的那幾樣加 .is-new，動畫就只播在新加的東西上。
    // 送出後的畫面沒有餐盤，這時會自然清空，回到點餐畫面時整盤重新播一次。
    function markNewTrayItems() {
      const current = new Set();
      root.querySelectorAll("[data-key]").forEach((el) => {
        current.add(el.dataset.key);
        if (!shownTrayKeys.has(el.dataset.key)) el.classList.add("is-new");
      });
      shownTrayKeys = current;
    }

    // 歷史紀錄的刪除／清除按鈕在兩種畫面都會出現，統一在這裡綁。
    function bindCommon() {
      root.querySelectorAll(".bo-history-remove").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.orders = state.orders.filter((o) => o.id !== btn.dataset.orderId);
          saveOrders(state.orders);
          render();
        });
      });

      const clearAll = root.querySelector("#bo-clear-all");
      if (clearAll) {
        clearAll.addEventListener("click", () => {
          if (!confirm("要清除全部的點餐紀錄嗎？")) return;
          state.orders = [];
          saveOrders(state.orders);
          render();
        });
      }
    }

    // 有 multi 的類別可以複選（再點一次取消）；沒有的（飲料）是單選，點別的就換掉原本那杯。
    function toggleItem(groupId, itemId) {
      const group = BREAKFAST_MENU.find((g) => g.id === groupId);
      const picked = state.selected[groupId] || [];
      const wasPicked = picked.includes(itemId);
      const next = wasPicked
        ? picked.filter((id) => id !== itemId)
        : (group.multi ? picked.concat(itemId) : [itemId]);
      if (next.length > 0) state.selected[groupId] = next;
      else delete state.selected[groupId];
      playTone(wasPicked ? 380 : 620, 0.08);
      render();
    }

    // 一律照菜單順序輸出，不是點選順序 —— 這樣同一樣東西在餐盤裡的位置固定，
    // 不會因為先點誰而跳來跳去。
    function selectedList() {
      const list = [];
      BREAKFAST_MENU.forEach((group) => {
        const ids = state.selected[group.id] || [];
        if (ids.length === 0) return;
        groupItems(group).forEach((item) => {
          if (!ids.includes(item.id)) return;
          list.push({ categoryId: group.id, category: group.label, id: item.id, name: item.name, emoji: item.emoji, icon: item.icon, price: item.price, zhuyin: item.zhuyin });
        });
      });
      return list;
    }

    // 加總金額。舊的訂單紀錄沒有 price 欄位，這種就回 null，畫面上單純不顯示金額，不要顯示錯的數字。
    function sumPrice(items) {
      if (items.some((i) => typeof i.price !== "number")) return null;
      return items.reduce((total, i) => total + i.price, 0);
    }

    function handleSubmit() {
      const items = selectedList();
      if (items.length === 0) return;
      const order = { id: `${Date.now()}`, timestamp: new Date().toISOString(), items };
      state.orders = [order, ...state.orders];
      saveOrders(state.orders);
      state.lastOrder = order;
      state.view = "done";
      render();
      window.scrollTo(0, 0);
      spawnConfetti(root.querySelector(".bo-receipt"));
      playCorrectSound();
      setTimeout(() => speakText("早餐點好囉，馬上來"), 400);
    }

    function renderOrder() {
      const picked = selectedList();
      const total = sumPrice(picked);
      return `
        <div class="shop-head">
          <div class="shop-sign">🥪</div>
          <h1 class="shop-title">女兒早餐店</h1>
          <p class="shop-subtitle">今天想吃什麼呢？</p>
        </div>
        <div class="info-banner">
          <span class="info-emoji">👩‍🍳</span>
          <span>主食、蛋白質、水果想點幾樣都可以，飲料只能選一杯～每一類都可以不點，點好按下面的「送出訂單」！</span>
        </div>
        <div class="order-count">🧺 已點 ${picked.length} 樣</div>
        ${BREAKFAST_MENU.map(renderGroup).join("")}
        <div class="bo-summary">
          <span class="bo-summary-label">🍽️ 我的餐盤</span>
          ${renderTray(picked)}
          ${picked.length === 0 ? "" : `<div class="bo-summary-total">💰 合計 <strong>${total}</strong> 元</div>`}
        </div>
        <button class="big-button" id="bo-submit" ${picked.length === 0 ? "disabled" : ""}>🛎️ 送出訂單${picked.length === 0 ? "" : `（${total} 元）`}</button>
        ${renderHistory()}
      `;
    }

    // 餐盤：分格餐盤，食物三類一類一格、飲料進旁邊的杯子，像真的一份早餐。
    // 每格自己標類別名，空格是虛線，所以「哪一類還沒點」看格子就知道，不用另外補提示文字。
    // 只用在點餐畫面（食物會隨著點選一樣一樣出現）；送出後的訂單卡不重複顯示餐盤，
    // 那邊已經有逐項條列跟總金額了，再放一次餐盤只是佔位置。
    function renderTray(items) {
      const byCategory = {};
      items.forEach((i) => {
        // categoryId 是 selectedList 一定會給的；退回用 label 找是留給格式較舊的資料。
        const key = i.categoryId || (BREAKFAST_MENU.find((g) => g.label === i.category) || {}).id;
        if (!key) return;
        (byCategory[key] = byCategory[key] || []).push(i);
      });

      const drink = (byCategory.drink || [])[0];
      const foodGroups = BREAKFAST_MENU.filter((g) => g.id !== "drink");

      return `
        <div class="tray">
          <div class="plate">
            ${foodGroups.map((group) => {
              const cell = byCategory[group.id] || [];
              // 欄數/字級是靠 count-N 決定的，6 樣以上一律吃 count-6 那組。
              return `
                <div class="plate-cell count-${Math.min(cell.length, 6)}${cell.length === 0 ? " is-empty" : ""}">
                  <span class="plate-cell-label">${escapeHtml(group.label)}</span>
                  ${cell.length === 0 ? "" : `
                    <div class="plate-cell-items">
                      ${cell.map((item) => `
                        <span class="plate-item" data-key="${escapeHtml(group.id)}:${escapeHtml(item.id || item.name)}">
                          ${renderItemIcon(item, "plate-emoji")}
                          <span class="plate-name">${escapeHtml(item.name)}</span>
                        </span>`).join("")}
                    </div>`}
                </div>`;
            }).join("")}
          </div>
          <div class="cup-side">
            <div class="cup${drink ? " filled" : ""}"${drink ? ` data-key="drink:${escapeHtml(drink.id || drink.name)}"` : ""}>
              ${drink
                ? `${renderItemIcon(drink, "cup-emoji")}<span class="cup-name">${escapeHtml(drink.name)}</span>`
                : ""}
            </div>
            <span class="cup-label">飲料</span>
          </div>
        </div>
      `;
    }

    function renderGroup(group) {
      const items = groupItems(group);
      const pickedIds = state.selected[group.id] || [];
      const pickedItems = items.filter((i) => pickedIds.includes(i.id));
      // 複選類報樣數，單選的飲料直接報是哪一杯；沒點的時候順便把規則講清楚。
      const pickLabel = pickedItems.length === 0
        ? (group.multi ? "可以點很多樣" : "只能選一杯")
        : (group.multi ? `已選 ${pickedItems.length} 樣` : `已選：${escapeHtml(pickedItems[0].name)}`);
      const hasSpecials = group.acceptsDaily && state.dailySpecials.length > 0;
      const note = group.acceptsDaily
        ? (hasSpecials ? "香蕉、蘋果每天都有，今天還多了特選水果喔！" : "香蕉、蘋果每天都有～")
        : group.note;
      return `
        <div class="bo-group accent-${group.accent}">
          <div class="bo-group-head">
            <span class="bo-group-icon">${renderEmoji(group.emoji, "bo-group-icon-img")}</span>
            <span class="bo-group-label">${escapeHtml(group.label)}${hasSpecials ? `<span class="bo-daily-tag">✨ 今日特選</span>` : ""}</span>
            <span class="bo-group-pick${pickedItems.length > 0 ? " is-picked" : ""}">${pickLabel}</span>
          </div>
          ${note ? `<div class="bo-group-note">${escapeHtml(note)}</div>` : ""}
          <div class="bo-item-grid">
            ${items.map((item) => `
              <button class="bo-item${pickedIds.includes(item.id) ? " selected" : ""}" data-group="${group.id}" data-item="${escapeHtml(item.id)}">
                ${item.special ? `<span class="bo-item-special">✨</span>` : ""}
                ${renderItemIcon(item, "bo-item-emoji")}
                ${renderName(item, "bo-item-name")}
                <span class="bo-item-price">${item.price} 元</span>
                <span class="bo-item-check">✓</span>
              </button>`).join("")}
          </div>
        </div>
      `;
    }

    function renderDone() {
      const order = state.lastOrder;
      const total = sumPrice(order.items);
      return `
        <div class="bo-receipt">
          <div class="bo-receipt-emoji">🛎️</div>
          <div class="bo-receipt-title">訂單送出囉！</div>
          <div class="bo-receipt-subtitle">${formatFullTime(order.timestamp)}</div>
          <div class="bo-receipt-list">
            ${order.items.map((i) => `
              <div class="bo-receipt-row">
                ${renderItemIcon(i, "bo-receipt-emoji-img")}
                <span class="bo-receipt-name">${escapeHtml(i.name)}</span>
                <span class="bo-receipt-cat">${escapeHtml(i.category)}</span>
                ${typeof i.price === "number" ? `<span class="bo-receipt-price">${i.price} 元</span>` : ""}
              </div>`).join("")}
            ${total === null ? "" : `
              <div class="bo-receipt-row is-total">
                <span class="bo-receipt-name">總共</span>
                <span class="bo-receipt-price is-total">${total} 元</span>
              </div>`}
          </div>
          <div class="bo-receipt-mascot">🍳 早餐做好囉，快來吃！</div>
        </div>
        <div class="bo-actions">
          <button class="big-button" id="bo-again">🔄 再點一次</button>
        </div>
        ${renderHistory()}
      `;
    }

    // 刪除相關的 UI（每筆的 ✕、清除全部紀錄）只有在家長開了「可刪除紀錄」時才畫出來。
    // 「看統計」不受影響，而且沒有紀錄時也要留著 —— 換裝置後就是從統計頁把備份匯入回來的。
    function renderHistory() {
      const links = `
        <div class="bo-history-links">
          <a class="bo-stats-link" href="breakfast-stats.html">📊 看統計</a>
          ${state.allowDelete && state.orders.length > 0
            ? `<span class="bo-clear-all" id="bo-clear-all">🗑️ 清除全部紀錄</span>`
            : ""}
        </div>
      `;

      if (state.orders.length === 0) {
        return `
          <div class="bo-history">
            <div class="bo-history-head">
              <span class="bo-history-title">📋 點餐紀錄</span>
            </div>
            <div class="bo-history-empty">還沒有任何紀錄，點好餐按「送出訂單」就會存在這裡 ✨</div>
            ${links}
          </div>
        `;
      }
      return `
        <div class="bo-history">
          <div class="bo-history-head">
            <span class="bo-history-title">📋 點餐紀錄</span>
            <span class="bo-history-count">共 ${state.orders.length} 筆</span>
          </div>
          <div class="bo-history-list">
            ${state.orders.map((o) => `
              <div class="bo-history-row">
                <div class="bo-history-text">
                  <span class="bo-history-time">🕘 ${formatFullTime(o.timestamp)}${sumPrice(o.items) === null ? "" : `<span class="bo-history-total">${sumPrice(o.items)} 元</span>`}</span>
                  <span class="bo-history-items">${o.items.map((i) => `<span class="bo-history-chip">${renderItemIcon(i, "bo-chip-emoji")}${escapeHtml(i.name)}</span>`).join("")}</span>
                </div>
                ${state.allowDelete ? `<button class="bo-history-remove" data-order-id="${o.id}" aria-label="刪除這筆紀錄">✕</button>` : ""}
              </div>`).join("")}
          </div>
          ${links}
        </div>
      `;
    }

    // ---------- 家長設定 ----------

    // 入口刻意藏起來：長按店招 🥪 三秒才會打開，畫面上完全沒有提示，小孩不會誤觸。
    // 按住的時候招牌會慢慢放大當進度提示，放開就取消。
    const PARENT_HOLD_MS = 3000;
    let holdTimer = null;

    function bindParentGate() {
      const sign = root.querySelector(".shop-sign");
      if (!sign) return;

      const start = (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        sign.classList.add("is-holding");
        holdTimer = setTimeout(() => {
          sign.classList.remove("is-holding");
          playTone(880, 0.12);
          openParentPanel();
        }, PARENT_HOLD_MS);
      };
      const cancel = () => {
        clearTimeout(holdTimer);
        sign.classList.remove("is-holding");
      };

      sign.addEventListener("pointerdown", start);
      ["pointerup", "pointerleave", "pointercancel"].forEach((evt) => sign.addEventListener(evt, cancel));
      // 長按在手機上會跳出系統選單，擋掉才不會蓋住我們的面板。
      sign.addEventListener("contextmenu", (e) => e.preventDefault());
    }

    function openParentPanel() {
      state.parentDraft = state.dailySpecials.map((i) => ({ ...i }));
      state.parentDraftAllowDelete = state.allowDelete;
      renderParentPanel();
    }

    function closeParentPanel() {
      state.parentDraft = null;
      const overlay = document.querySelector("#parent-overlay");
      if (overlay) overlay.remove();
    }

    function renderParentPanel() {
      let overlay = document.querySelector("#parent-overlay");
      if (!overlay) {
        overlay = document.createElement("div");
        overlay.id = "parent-overlay";
        document.body.appendChild(overlay);
      }

      const draft = state.parentDraft;
      const fruitGroup = BREAKFAST_MENU.find((g) => g.id === "fruit");
      const full = draft.length >= MAX_DAILY_FRUITS;
      const stale = state.lastDaily.date && state.lastDaily.date !== todayKey() && state.lastDaily.items.length > 0;

      overlay.innerHTML = `
        <div class="parent-panel">
          <div class="parent-head">
            <span class="parent-title">🔧 家長設定</span>
            <button class="parent-close" id="parent-close" aria-label="關閉">✕</button>
          </div>
          <p class="parent-subtitle">設定今天的「今日特選」水果。香蕉、蘋果是固定的，不用設定。<br>設定只算今天，明天會自動清空，避免推薦到家裡沒有的水果。</p>

          <div class="parent-section">
            <span class="parent-section-title">今天已選 ${draft.length} / ${MAX_DAILY_FRUITS} 種</span>
            <div class="parent-chosen">${draft.length === 0
              ? `<span class="parent-empty">還沒設定 — 小孩現在只會看到香蕉、蘋果</span>`
              : draft.map((i) => `<span class="parent-chip">${renderEmoji(i.emoji, "bo-chip-emoji")}${escapeHtml(i.name)}<span class="bo-chip-price">${i.price} 元</span><button class="parent-chip-remove" data-remove="${escapeHtml(i.id)}" aria-label="移除">✕</button></span>`).join("")}</div>
            ${full ? `<span class="parent-note">已經滿 ${MAX_DAILY_FRUITS} 種了，要換的話先按上面的 ✕ 拿掉一種。</span>` : ""}
            ${stale ? `<button class="parent-reuse" id="parent-reuse">↩️ 沿用 ${escapeHtml(state.lastDaily.date.slice(5).replace("-", "/"))} 的設定（${state.lastDaily.items.map((i) => escapeHtml(i.name)).join("、")}）</button>` : ""}
          </div>

          <div class="parent-section">
            <span class="parent-section-title">從清單挑</span>
            <div class="parent-preset-grid">
              ${fruitGroup.extraItems.map((item) => `
                <button class="parent-preset${draft.some((d) => d.id === item.id) ? " selected" : ""}" data-preset="${item.id}"${full && !draft.some((d) => d.id === item.id) ? " disabled" : ""}>
                  ${renderEmoji(item.emoji, "parent-preset-emoji")}
                  <span class="parent-preset-name">${escapeHtml(item.name)}</span>
                  <span class="parent-preset-price">${item.price} 元</span>
                </button>`).join("")}
            </div>
          </div>

          <div class="parent-section">
            <span class="parent-section-title">自己輸入</span>
            <div class="parent-emoji-row">
              ${FRUIT_EMOJI_PALETTE.map((e, idx) => `<button class="parent-emoji${idx === 0 ? " selected" : ""}" data-emoji="${e}">${renderEmoji(e, "parent-emoji-img")}</button>`).join("")}
            </div>
            <div class="parent-custom-row">
              <input class="parent-input" id="parent-name" type="text" placeholder="水果名稱，例如 芭樂" maxlength="8"${full ? " disabled" : ""} />
              <input class="parent-input parent-input-price" id="parent-price" type="number" value="20" min="0" max="200" step="5"${full ? " disabled" : ""} />
              <span class="parent-unit">元</span>
              <button class="parent-add" id="parent-add"${full ? " disabled" : ""}>加入</button>
            </div>
          </div>

          <div class="parent-section">
            <span class="parent-section-title">點餐紀錄</span>
            <button class="parent-toggle${state.parentDraftAllowDelete ? " on" : ""}" id="parent-allow-delete" role="switch" aria-checked="${state.parentDraftAllowDelete}">
              <span class="parent-toggle-box">✓</span>
              <span class="parent-toggle-text">
                <span class="parent-toggle-title">可刪除紀錄</span>
                <span class="parent-toggle-note">打開才會出現每筆的 ✕ 跟「清除全部紀錄」。關著的話小孩不會誤刪。</span>
              </span>
            </button>
          </div>

          <div class="parent-actions">
            <button class="big-button" id="parent-save">✅ 完成設定</button>
            <button class="ghost-button" id="parent-clear">🗑️ 清空今日特選</button>
          </div>
        </div>
      `;

      overlay.querySelector("#parent-close").addEventListener("click", closeParentPanel);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeParentPanel(); });

      overlay.querySelectorAll("[data-preset]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = fruitGroup.extraItems.find((i) => i.id === btn.dataset.preset);
          const at = draft.findIndex((d) => d.id === item.id);
          if (at >= 0) draft.splice(at, 1);
          else if (draft.length < MAX_DAILY_FRUITS) draft.push({ ...item });
          renderParentPanel();
        });
      });

      overlay.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const at = draft.findIndex((d) => d.id === btn.dataset.remove);
          if (at >= 0) draft.splice(at, 1);
          renderParentPanel();
        });
      });

      overlay.querySelectorAll("[data-emoji]").forEach((btn) => {
        btn.addEventListener("click", () => {
          overlay.querySelectorAll("[data-emoji]").forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
        });
      });

      overlay.querySelector("#parent-add").addEventListener("click", () => {
        if (draft.length >= MAX_DAILY_FRUITS) return;
        const nameInput = overlay.querySelector("#parent-name");
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); return; }
        const priceRaw = Number(overlay.querySelector("#parent-price").value);
        const price = Number.isFinite(priceRaw) && priceRaw >= 0 ? Math.round(priceRaw) : 20;
        const chosen = overlay.querySelector("[data-emoji].selected");
        // 只收 palette 裡的 emoji，避免自由輸入的字串跑進 renderEmoji 的 onerror 屬性。
        const emoji = chosen && FRUIT_EMOJI_PALETTE.includes(chosen.dataset.emoji) ? chosen.dataset.emoji : FRUIT_EMOJI_PALETTE[0];
        draft.push({ id: `custom-${Date.now()}`, name, emoji, price });
        renderParentPanel();
      });

      if (stale) {
        overlay.querySelector("#parent-reuse").addEventListener("click", () => {
          state.parentDraft = state.lastDaily.items.slice(0, MAX_DAILY_FRUITS).map((i) => ({ ...i }));
          renderParentPanel();
        });
      }

      overlay.querySelector("#parent-allow-delete").addEventListener("click", () => {
        state.parentDraftAllowDelete = !state.parentDraftAllowDelete;
        renderParentPanel();
      });

      overlay.querySelector("#parent-clear").addEventListener("click", () => {
        state.parentDraft = [];
        renderParentPanel();
      });

      overlay.querySelector("#parent-save").addEventListener("click", () => {
        state.dailySpecials = draft.map((i) => ({ ...i }));
        saveDailySpecials(state.dailySpecials);
        state.lastDaily = { date: todayKey(), items: state.dailySpecials };
        state.allowDelete = state.parentDraftAllowDelete;
        saveAllowDelete(state.allowDelete);
        // 特選被拿掉時，小孩原本選的那幾樣要一起清掉，否則會送出畫面上已經看不到的品項。
        const stillOnMenu = groupItems(fruitGroup);
        const keptFruit = (state.selected.fruit || []).filter((id) => stillOnMenu.some((i) => i.id === id));
        if (keptFruit.length > 0) state.selected.fruit = keptFruit;
        else delete state.selected.fruit;
        closeParentPanel();
        render();
      });
    }

    // ---------- 小工具 ----------

    // Twemoji（CC-BY 4.0 開源 emoji 圖庫）圖片，讓圖案在所有裝置/瀏覽器上長得一致，
    // 不依賴系統字型是否收錄該 emoji；載不到才退回系統字型。
    function twemojiUrl(emoji) {
      const codepoints = Array.from(emoji)
        .map((c) => c.codePointAt(0))
        .filter((cp) => cp !== 0xfe0f)
        .map((cp) => cp.toString(16))
        .join("-");
      return `https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/${codepoints}.png`;
    }

    function renderEmoji(emoji, cls) {
      const url = twemojiUrl(emoji);
      return `<img class="${cls}" src="${url}" alt="${escapeHtml(emoji)}" onerror="this.outerHTML='<span class=&quot;${cls} is-fallback&quot;>${emoji}</span>'">`;
    }

    // 名稱加注音：每個字右邊直排一個注音，跟課本的排版一樣。
    // 不用 <ruby>，因為 bopomofo 需要的 ruby-position:inter-character 各家瀏覽器支援不一致；
    // 也不用 writing-mode:vertical-rl（iPad Safari 會把符號疊在一起，見 .zh-base 的註解），
    // 改成一個符號包一個 span、用 flex 直向疊起來，行為才會到處都一樣。
    // 家長自己輸入的水果沒有注音資料，就退回只顯示文字。
    // 課本的直排注音，聲調不是接在注音柱最後面，而是另外擺：
    // 二三四聲放在注音柱「右邊、對齊最後一個符號」，輕聲的點放在注音柱「正上方」。
    // 所以這裡先把聲調從音節字串裡拆出來，讓 CSS 各自定位。
    function splitZhuyin(syllable) {
      if (syllable.startsWith("˙")) return { base: syllable.slice(1), tone: "˙", neutral: true };
      const last = syllable.slice(-1);
      if (TONE_MARKS.includes(last)) return { base: syllable.slice(0, -1), tone: last, neutral: false };
      return { base: syllable, tone: "", neutral: false };
    }

    function renderName(item, cls) {
      const chars = Array.from(item.name);
      if (!Array.isArray(item.zhuyin) || item.zhuyin.length !== chars.length) {
        return `<span class="${cls}">${escapeHtml(item.name)}</span>`;
      }
      return `<span class="${cls} has-zhuyin">${chars.map((c, i) => {
        const { base, tone, neutral } = splitZhuyin(item.zhuyin[i]);
        const mods = `${tone ? (neutral ? " has-neutral" : " has-tone") : ""}`;
        return `
        <span class="zh-char">
          <span class="zh-han">${escapeHtml(c)}</span>
          <span class="zh-yin${mods}">
            <span class="zh-base">${Array.from(base).map((y) => `<span class="zh-sym">${escapeHtml(y)}</span>`).join("")}</span>
            ${tone ? `<span class="zh-tone${neutral ? " is-neutral" : ""}">${tone}</span>` : ""}
          </span>
        </span>`;
      }).join("")}</span>`;
    }

    // 品項圖示：有自畫的 SVG 就用自畫的，沒有才回去用 Twemoji 圖。
    // 舊的訂單紀錄可能沒有 icon 欄位，這時就沿用當初存下來的 emoji，不會壞掉。
    function renderItemIcon(item, cls) {
      const custom = item.icon && CUSTOM_ICONS[item.icon];
      return custom ? custom.replace("{{cls}}", cls) : renderEmoji(item.emoji, cls);
    }

    function loadOrders() {
      try {
        return JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveOrders(orders) {
      try {
        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      } catch (e) {
        // 無痕模式等情況下寫不進去，就讓這一輪只留在畫面上，不要整頁壞掉。
      }
    }

    function formatFullTime(iso) {
      const d = new Date(iso);
      return `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // 提示音用 Web Audio API 即時合成、語音用瀏覽器內建 speechSynthesis，都不需要外部音檔。
    let audioCtx = null;
    function playTone(freq, duration, type = "sine") {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain).connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // 瀏覽器不給放音就安靜跳過。
      }
    }

    function playCorrectSound() {
      playTone(660, 0.12);
      setTimeout(() => playTone(880, 0.18), 110);
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-TW";
      utter.rate = 0.95;
      speechSynthesis.speak(utter);
    }

    function spawnConfetti(container) {
      if (!container) return;
      const pieces = ["✨", "⭐", "🎉"];
      for (let i = 0; i < 6; i++) {
        const span = document.createElement("span");
        span.className = "confetti-piece";
        span.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        span.style.left = `${10 + Math.random() * 80}%`;
        span.style.animationDelay = `${Math.random() * 0.2}s`;
        container.appendChild(span);
        setTimeout(() => span.remove(), 1200);
      }
    }
  </script>
</body>
</html>
